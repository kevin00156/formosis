name: thesis-ccu
type: thesis
style: ccu
description: 國立中正大學（National Chung Cheng University）學位論文格式（依機械工程學系論文實例）。
# 格式來源：規範的出處與可信度，新增或修改 profile 時務必填寫。
# status: verified = 已對照校方正式規範；derived = 依實際論文／系所範本推得，未對照校方條文
source:
  status: derived
  basis: 國立中正大學機械工程學系實驗室學長通過口試之論文 Word 檔
  url: https://oaa.ccu.edu.tw/var/file/4/1004/img/832/186876826.pdf
  note: >-
    中正大學現行校方文件（學位論文管理要點，112.05.08 修正）未規定版面格式，由各系所自訂；
    本 profile 非校方正式規範，其他系所請與系辦或指導教授確認。邊界 2.5/2.5/3/2 cm 與 90 年
    舊版校級「學位論文格式規範」相同，但該規範已非現行；電機／通訊所等採 Word 預設
    2.54/3.17 cm。上傳圖書館前全文須自行嵌入中正大學浮水印
    （https://cloud.ncl.edu.tw/ccu/download.php，在 paper.md YAML 設 watermark:）。
language: zh-TW
template: ../../shared/latex/thesis.latex   # 共用模板；學校差異在 thesisprofile.sty
