name: thesis-ntust
type: thesis
style: ntust
description: 國立臺灣科技大學（National Taiwan University of Science and Technology）學位論文格式。
# 格式來源：規範的出處與可信度，新增或修改 profile 時務必填寫。
# status: verified = 已對照校方正式規範；derived = 依實際論文／系所範本推得，未對照校方條文
source:
  status: verified
  basis: >-
    國立臺灣科技大學學位論文撰寫、編排規則及注意事項（112.03.07 第211次、
    113.12.24 第218次教務會議通過；112學年度起適用）；圖書館「研究生上傳畢業論文說明」
    （114學年度第2學期起適用）
  url: https://www.academic.ntust.edu.tw/var/file/48/1048/img/2554/604024536.pdf
  version: "113.12.24"
  note: >-
    紙張、邊界、頁碼（前置頁大寫羅馬、正文阿拉伯）、字級（章與摘要等標題 20pt 粗、
    節 18pt、內文 12pt）、行距 1.5、編號階層（第一章、一、(一)、1.、(1)）、圖表分章編號
    圖1-1、封面版型（附錄一）、前置頁順序（第三點）依條文。中文字型條文為標楷體或新細明體，
    本 profile 採標楷體。內文條文為 12pt 或 13pt，採 12pt。條文「小節等標題 18pt」，本 profile
    對「一、」「(一)」兩層用 18pt，「1.」「(1)」兩層用內文字級加粗，避免低層標題比內文大太多。
    「論文內頁之論文題目 24pt 加粗」解讀為書名頁題目；封面依附錄一 18pt。條文目錄範例
    （附錄七）把誌謝排在中文摘要前、頁碼 I，與第三點編排順序（誌謝在英文摘要後）矛盾，
    以第三點為準。條文未規定：公式編號（採分章 (1-1)）、圖表標題位置（圖名在圖下、表名在
    表上）、頁碼距底距離。推薦書、審定書由學生資訊系統產生，skeleton 為佔位頁。紙本順序含
    書名頁，圖書館要求電子檔前三頁為封面、推薦書、審定書，上傳前請在 paper.md 關閉書名頁。
    電子檔浮水印由系統自動加入，勿自行加。封面樣式、字級、行距等系所另有規定者從其規定。
language: zh-TW
template: ../../shared/latex/thesis.latex   # 共用模板；學校差異在 thesisprofile.sty
skeleton: skeleton/
skill: skill/SKILL.md
defaults:
  bib-style: ieee
  pdf-engine: xelatex
  csl: shared/cites/ieee.csl
