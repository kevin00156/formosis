name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 與 build.yml 共用 docker/paper.Dockerfile 與 GHA cache：套件清單只有一份真相來源
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build paper image (local, no registry)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/paper.Dockerfile
          load: true
          tags: formosis-paper:ci
          cache-from: type=gha,scope=formosis-paper
          cache-to: type=gha,mode=max,scope=formosis-paper

      # 標楷體／Times New Roman 為專有字體，runner 上以免費替身編譯（同 build.yml）
      - name: Build example PDFs
        env:
          CI_MAIN_FONT: "Latin Modern Roman"
          CI_CJK_FONT: "AR PL UKai TW"
        run: |
          chmod +x scripts/build.sh
          for md in examples/minimal/paper.md examples/full/paper.md; do
            docker run --rm -v "$PWD":/workspace -w /workspace formosis-paper:ci \
              ./scripts/build.sh "$md" --main-font "$CI_MAIN_FONT" --cjk-font "$CI_CJK_FONT"
          done

      - name: Create release archive
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="formosis-${TAG}"
          mkdir -p dist/$ARCHIVE_NAME
          cp -r profiles shared scripts docs dist/$ARCHIVE_NAME/
          cp -r examples dist/$ARCHIVE_NAME/
          cp Makefile README.md LICENSE CHANGELOG.md CONTRIBUTING.md pyproject.toml .gitignore dist/$ARCHIVE_NAME/
          # 兩個範例 PDF 同名，另存成不同檔名再上傳，否則 release 只剩一個
          cp examples/minimal/paper.pdf dist/example-minimal.pdf
          cp examples/full/paper.pdf dist/example-full.pdf
          cd dist
          zip -r "${ARCHIVE_NAME}.zip" "$ARCHIVE_NAME"
          tar czf "${ARCHIVE_NAME}.tar.gz" "$ARCHIVE_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/formosis-*.zip
            dist/formosis-*.tar.gz
            dist/example-minimal.pdf
            dist/example-full.pdf
          generate_release_notes: true
          draft: false
          prerelease: false
